<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">חיווט: NodeMCU + דרייבר TB6612 (רכב 2 מנועים)</text>

  <!-- NodeMCU -->
  <rect x="40" y="80" width="170" height="380" rx="12" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="3"/>
  <text x="125" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">NodeMCU</text>
  <text x="125" y="130" text-anchor="middle" font-size="13" fill="#475569">(ESP8266)</text>
  <circle cx="210" cy="150" r="5" fill="#2563eb"/><text x="196" y="155" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">D1</text>
  <circle cx="210" cy="190" r="5" fill="#16a34a"/><text x="196" y="195" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">D2</text>
  <circle cx="210" cy="230" r="5" fill="#ea580c"/><text x="196" y="235" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">D5</text>
  <circle cx="210" cy="270" r="5" fill="#9333ea"/><text x="196" y="275" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">D6</text>
  <circle cx="210" cy="320" r="5" fill="#f59e0b"/><text x="196" y="325" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">3V3</text>
  <circle cx="210" cy="380" r="5" fill="#111827"/><text x="196" y="385" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">GND</text>
  <circle cx="210" cy="430" r="5" fill="#dc2626"/><text x="196" y="435" text-anchor="end" font-size="15" font-weight="bold" fill="#1e293b">Vin</text>

  <!-- breadboard 3V3 rail -->
  <rect x="285" y="285" width="60" height="130" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="315" y="270" text-anchor="middle" font-size="13" fill="#92400e">פס 3V3</text>
  <text x="315" y="255" text-anchor="middle" font-size="13" fill="#92400e">לוח ניסוי</text>
  <circle cx="345" cy="300" r="4" fill="#f59e0b"/>
  <circle cx="345" cy="330" r="4" fill="#f59e0b"/>
  <circle cx="345" cy="360" r="4" fill="#f59e0b"/>
  <circle cx="345" cy="390" r="4" fill="#f59e0b"/>

  <!-- TB6612 -->
  <rect x="470" y="70" width="200" height="430" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="570" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">TB6612</text>
  <circle cx="470" cy="150" r="5" fill="#2563eb"/><text x="484" y="155" font-size="14" font-weight="bold" fill="#1e293b">AIN1</text>
  <circle cx="470" cy="190" r="5" fill="#16a34a"/><text x="484" y="195" font-size="14" font-weight="bold" fill="#1e293b">AIN2</text>
  <circle cx="470" cy="230" r="5" fill="#ea580c"/><text x="484" y="235" font-size="14" font-weight="bold" fill="#1e293b">BIN1</text>
  <circle cx="470" cy="270" r="5" fill="#9333ea"/><text x="484" y="275" font-size="14" font-weight="bold" fill="#1e293b">BIN2</text>
  <circle cx="470" cy="300" r="5" fill="#f59e0b"/><text x="484" y="305" font-size="14" font-weight="bold" fill="#1e293b">PWMA</text>
  <circle cx="470" cy="330" r="5" fill="#f59e0b"/><text x="484" y="335" font-size="14" font-weight="bold" fill="#1e293b">STBY</text>
  <circle cx="470" cy="360" r="5" fill="#f59e0b"/><text x="484" y="365" font-size="14" font-weight="bold" fill="#1e293b">PWMB</text>
  <circle cx="470" cy="390" r="5" fill="#f59e0b"/><text x="484" y="395" font-size="14" font-weight="bold" fill="#1e293b">VCC</text>
  <circle cx="470" cy="430" r="5" fill="#111827"/><text x="484" y="435" font-size="14" font-weight="bold" fill="#1e293b">GND</text>
  <!-- bottom pins -->
  <circle cx="510" cy="500" r="5" fill="#dc2626"/><text x="510" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">VM</text>
  <circle cx="590" cy="500" r="5" fill="#111827"/><text x="590" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">GND</text>
  <!-- motor pins right -->
  <circle cx="670" cy="150" r="5" fill="#64748b"/><text x="658" y="140" text-anchor="end" font-size="13" fill="#475569">AO1</text>
  <circle cx="670" cy="175" r="5" fill="#64748b"/><text x="658" y="188" text-anchor="end" font-size="13" fill="#475569">AO2</text>
  <circle cx="670" cy="245" r="5" fill="#64748b"/><text x="658" y="235" text-anchor="end" font-size="13" fill="#475569">BO1</text>
  <circle cx="670" cy="270" r="5" fill="#64748b"/><text x="658" y="283" text-anchor="end" font-size="13" fill="#475569">BO2</text>

  <!-- signal wires -->
  <line x1="210" y1="150" x2="470" y2="150" stroke="#2563eb" stroke-width="4"/>
  <line x1="210" y1="190" x2="470" y2="190" stroke="#16a34a" stroke-width="4"/>
  <line x1="210" y1="230" x2="470" y2="230" stroke="#ea580c" stroke-width="4"/>
  <line x1="210" y1="270" x2="470" y2="270" stroke="#9333ea" stroke-width="4"/>

  <!-- 3V3 to rail, rail to driver -->
  <polyline points="210,320 250,320 250,300 285,300" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <line x1="345" y1="300" x2="470" y2="300" stroke="#f59e0b" stroke-width="3"/>
  <line x1="345" y1="330" x2="470" y2="330" stroke="#f59e0b" stroke-width="3"/>
  <line x1="345" y1="360" x2="470" y2="360" stroke="#f59e0b" stroke-width="3"/>
  <line x1="345" y1="390" x2="470" y2="390" stroke="#f59e0b" stroke-width="3"/>

  <!-- GND NodeMCU to driver -->
  <polyline points="210,380 255,380 255,430 470,430" fill="none" stroke="#111827" stroke-width="4"/>
  <text x="360" y="424" text-anchor="middle" font-size="13" fill="#334155">אדמה משותפת ⚠</text>

  <!-- motors -->
  <rect x="790" y="120" width="160" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  <text x="870" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">מנוע שמאל</text>
  <text x="870" y="172" text-anchor="middle" font-size="13" fill="#854d0e">(המנוע הצהוב)</text>
  <rect x="790" y="220" width="160" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  <text x="870" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">מנוע ימין</text>
  <text x="870" y="272" text-anchor="middle" font-size="13" fill="#854d0e">(המנוע הצהוב)</text>
  <line x1="670" y1="150" x2="790" y2="140" stroke="#64748b" stroke-width="4"/>
  <line x1="670" y1="175" x2="790" y2="165" stroke="#64748b" stroke-width="4"/>
  <line x1="670" y1="245" x2="790" y2="245" stroke="#64748b" stroke-width="4"/>
  <line x1="670" y1="270" x2="790" y2="270" stroke="#64748b" stroke-width="4"/>

  <!-- battery -->
  <rect x="440" y="600" width="240" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="560" y="635" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">בית סוללות 4×AA</text>
  <text x="560" y="658" text-anchor="middle" font-size="14" fill="#991b1b">6V</text>
  <circle cx="480" cy="600" r="6" fill="#dc2626"/><text x="480" y="588" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">+</text>
  <circle cx="650" cy="600" r="6" fill="#111827"/><text x="650" y="588" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">−</text>

  <!-- battery plus: to VM and Vin -->
  <polyline points="480,600 480,560 510,560 510,500" fill="none" stroke="#dc2626" stroke-width="4"/>
  <polyline points="480,560 240,560 240,430 210,430" fill="none" stroke="#dc2626" stroke-width="4"/>
  <circle cx="480" cy="560" r="5" fill="#dc2626"/>
  <text x="350" y="552" text-anchor="middle" font-size="13" fill="#b91c1c">הפלוס מתפצל: גם ל-VM וגם ל-Vin</text>
  <!-- battery minus to driver bottom GND -->
  <polyline points="650,600 650,560 590,560 590,500" fill="none" stroke="#111827" stroke-width="4"/>

  <text x="500" y="715" text-anchor="middle" font-size="15" fill="#334155">⚠ בלי חוט STBY ל-3V3 הדרייבר "ישן" ושום דבר לא יזוז — לא לשכוח אותו!</text>
  <text x="500" y="740" text-anchor="middle" font-size="14" fill="#64748b">ללוח TB6612 יש כמה פיני GND — כולם אותה נקודה. מחווטים רק כשהכול כבוי.</text>
</svg>
