<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>צהלה 3D — שכונה במיקרו־פירוט</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1420; }
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; color: #fff; text-align: center;
    background: radial-gradient(120% 100% at 50% 110%, #24486b 0%, #101b2e 55%, #0a111d 100%);
    transition: opacity .8s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #load-title { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
  #load-title span { color: #ffb45c; }
  #load-sub { color: #9fb4cc; font-size: 15px; margin-top: -10px; }
  #load-bar { width: min(420px, 78vw); height: 10px; border-radius: 99px;
    background: rgba(255,255,255,.12); overflow: hidden; }
  #load-bar-in { height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ffb45c, #ff7e5c); transition: width .25s; }
  #load-caption { color: #c9d6e8; font-size: 14px; min-height: 20px; }

  #hud { position: fixed; top: 14px; right: 14px; z-index: 20; width: 262px;
    background: rgba(13, 18, 30, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14); border-radius: 16px; color: #eef2f8;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); overflow: hidden; }
  #hud-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  #hud-title { font-size: 21px; font-weight: 800; }
  #hud-title span { color: #ffb45c; }
  #hud-sub { font-size: 11.5px; color: #9db1c9; margin-top: 1px; }
  #hud-min { background: rgba(255,255,255,.1); color: #fff; border: 0; width: 26px; height: 26px;
    border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1; }
  #hud-body { padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #stats div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 6px 9px; }
  #stats b { display: block; font-size: 15px; color: #ffcf9b; }
  #stats span { font-size: 10.5px; color: #a7b8cd; }
  .row { display: flex; gap: 6px; align-items: center; }
  .presets button { flex: 1; background: rgba(255,255,255,.08); color: #dfe7f2; border: 1px solid transparent;
    padding: 7px 4px; border-radius: 10px; cursor: pointer; font-size: 12.5px; font-family: inherit; }
  .presets button.on { background: rgba(255, 180, 92, .22); border-color: rgba(255, 180, 92, .6); color: #ffd9a8; }
  .slider-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .slider-row input { flex: 1; accent-color: #ffb45c; direction: ltr; }
  #hour-v { font-variant-numeric: tabular-nums; font-size: 12px; color: #cdd9ea; width: 38px; }
  .chips { flex-wrap: wrap; }
  .chips label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #c3d0e2;
    background: rgba(255,255,255,.06); padding: 4px 8px; border-radius: 8px; cursor: pointer; }
  .chips input { accent-color: #ffb45c; }
  #landmarks { flex: 1; background: rgba(255,255,255,.08); color: #e6ecf5; border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 7px; font-size: 12.5px; font-family: inherit; }
  #landmarks option { color: #111; }
  #tour { background: linear-gradient(135deg, #ffb45c, #ff8a5c); color: #26180c; font-weight: 700;
    border: 0; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 12.5px; font-family: inherit; }
  #hint { font-size: 10.5px; color: #8da2bb; line-height: 1.5; }

  #popup { position: fixed; display: none; z-index: 30; background: rgba(13,18,30,.88);
    backdrop-filter: blur(10px); color: #f2f6fb; border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px; padding: 9px 13px; font-size: 13px; line-height: 1.55; pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.4); max-width: 260px; }
  #popup b { color: #ffcf9b; }

  #credit { position: fixed; bottom: 8px; left: 10px; z-index: 20; color: rgba(255,255,255,.55);
    font-size: 10.5px; direction: rtl; }
  #fps { position: fixed; bottom: 8px; right: 12px; z-index: 20; color: rgba(255,255,255,.45);
    font-size: 10.5px; font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    #hud { width: 232px; top: 10px; right: 10px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loader">
  <div id="load-title">צהלה <span>3D</span></div>
  <div id="load-sub">שכונת צהלה · כל בית במקומו האמיתי · OSM + עיריית ת"א</div>
  <div id="load-bar"><div id="load-bar-in"></div></div>
  <div id="load-caption">טוען…</div>
</div>
<div id="fps"></div>
<script src="data/tzahala-data.js"></script>
<script src="bundle.js"></script>
</body>
</html>
