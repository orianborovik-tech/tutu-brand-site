<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#FFD580"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF"/>
      <stop offset="100%" style="stop-color:#00008B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="55" fill="url(#sun)" opacity="0.95"/>
  <!-- Sun rays -->
  <g stroke="#FFE066" stroke-width="3" opacity="0.7">
    <line x1="680" y1="10" x2="680" y2="0"/>
    <line x1="680" y1="150" x2="680" y2="160"/>
    <line x1="610" y1="80" x2="600" y2="80"/>
    <line x1="750" y1="80" x2="760" y2="80"/>
    <line x1="630" y1="30" x2="623" y2="23"/>
    <line x1="730" y1="130" x2="737" y2="137"/>
    <line x1="730" y1="30" x2="737" y2="23"/>
    <line x1="630" y1="130" x2="623" y2="137"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.85">
    <ellipse cx="120" cy="80" rx="60" ry="25"/>
    <ellipse cx="160" cy="70" rx="50" ry="28"/>
    <ellipse cx="85" cy="90" rx="40" ry="18"/>

    <ellipse cx="380" cy="60" rx="50" ry="20"/>
    <ellipse cx="420" cy="52" rx="45" ry="22"/>
    <ellipse cx="350" cy="65" rx="35" ry="16"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="310" width="800" height="190" fill="url(#sea)"/>

  <!-- Waves -->
  <g fill="none" stroke="#5BB8FF" stroke-width="2.5" opacity="0.6">
    <path d="M0,325 Q50,315 100,325 Q150,335 200,325 Q250,315 300,325 Q350,335 400,325 Q450,315 500,325 Q550,335 600,325 Q650,315 700,325 Q750,335 800,325"/>
    <path d="M0,345 Q60,335 120,345 Q180,355 240,345 Q300,335 360,345 Q420,355 480,345 Q540,335 600,345 Q660,355 720,345 Q760,335 800,345"/>
    <path d="M0,365 Q70,355 140,365 Q210,375 280,365 Q350,355 420,365 Q490,375 560,365 Q630,355 700,365 Q750,372 800,365"/>
  </g>

  <!-- Water splashes under feet -->
  <g fill="#A8DFFF" opacity="0.8">
    <ellipse cx="370" cy="355" rx="30" ry="8"/>
    <ellipse cx="430" cy="348" rx="22" ry="6"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M355,350 Q350,338 344,330"/>
    <path d="M365,348 Q362,336 360,326"/>
    <path d="M380,346 Q382,334 385,325"/>
    <path d="M420,344 Q418,334 415,325"/>
    <path d="M433,342 Q436,332 440,323"/>
  </g>

  <!-- Shadow on water -->
  <ellipse cx="400" cy="360" rx="50" ry="10" fill="#0055AA" opacity="0.25"/>

  <!-- === RUNNER === -->
  <!-- Body torso -->
  <rect x="382" y="235" width="36" height="55" rx="8" fill="#F4A261"/>

  <!-- Head -->
  <circle cx="400" cy="210" r="28" fill="#F4A261"/>
  <!-- Hair -->
  <ellipse cx="400" cy="190" rx="27" ry="14" fill="#4A2800"/>
  <ellipse cx="385" cy="197" rx="12" ry="8" fill="#4A2800"/>
  <!-- Face -->
  <ellipse cx="392" cy="212" rx="3" ry="4" fill="#3B1F00" opacity="0.8"/> <!-- left eye -->
  <ellipse cx="408" cy="212" rx="3" ry="4" fill="#3B1F00" opacity="0.8"/> <!-- right eye -->
  <path d="M393,222 Q400,228 407,222" stroke="#3B1F00" stroke-width="2" fill="none"/> <!-- smile -->

  <!-- Shorts -->
  <rect x="379" y="286" width="42" height="28" rx="5" fill="#1E90FF"/>

  <!-- Left arm (back, behind body) - swung forward -->
  <line x1="382" y1="248" x2="350" y2="280" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
  <circle cx="344" cy="284" r="7" fill="#F4A261"/>

  <!-- Right arm - swung back -->
  <line x1="418" y1="248" x2="452" y2="272" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
  <circle cx="458" cy="276" r="7" fill="#F4A261"/>

  <!-- Left leg - forward stride -->
  <line x1="390" y1="310" x2="365" y2="350" stroke="#F4A261" stroke-width="13" stroke-linecap="round"/>
  <line x1="365" y1="350" x2="345" y2="355" stroke="#F4A261" stroke-width="11" stroke-linecap="round"/>
  <!-- Left shoe -->
  <ellipse cx="338" cy="357" rx="18" ry="7" fill="#222"/>

  <!-- Right leg - back stride -->
  <line x1="410" y1="310" x2="435" y2="348" stroke="#F4A261" stroke-width="13" stroke-linecap="round"/>
  <line x1="435" y1="348" x2="455" y2="342" stroke="#F4A261" stroke-width="11" stroke-linecap="round"/>
  <!-- Right shoe -->
  <ellipse cx="463" cy="343" rx="18" ry="7" fill="#222"/>

  <!-- Running shirt stripes -->
  <line x1="385" y1="242" x2="415" y2="242" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="384" y1="252" x2="416" y2="252" stroke="white" stroke-width="2.5" opacity="0.5"/>

  <!-- Distant birds -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <path d="M200,130 Q208,123 216,130"/>
    <path d="M220,118 Q228,111 236,118"/>
    <path d="M500,100 Q508,93 516,100"/>
    <path d="M520,112 Q528,105 536,112"/>
  </g>

  <!-- Beach/sand strip -->
  <rect x="0" y="300" width="800" height="18" fill="#F5DEB3"/>
  <rect x="0" y="308" width="800" height="10" fill="#EAC97A" opacity="0.5"/>
</svg>
