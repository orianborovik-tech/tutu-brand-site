<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANA — Melon &amp; Mint · Organic Yerba Maté</title>
<meta name="description" content="MANA Melon & Mint — organic energy infusion. Cold-brewed yerba maté, 120mg natural caffeine, no crash. 355 ml.">
<style>
  :root {
    --green-deep: #1e5b25;
    --green-bg: #6cbe45;
    --cream: #fef7e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--green-bg);
    color: var(--green-deep);
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 10;
        display: flex; flex-direction: column; justify-content: space-between; }
  header, footer { display: flex; justify-content: space-between; align-items: center;
                   padding: 28px 36px; }
  .brand img { height: 30px; display: block;
               filter: drop-shadow(0 1px 6px rgba(20, 70, 25, .25)); }
  .top-note, .bottom-note {
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600;
    color: rgba(255, 255, 255, .92);
  }
  footer { align-items: flex-end; }
  .product { pointer-events: auto; max-width: 430px; }
  .product .kicker { font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
                     font-weight: 700; color: #e8f7d8; margin-bottom: 10px; }
  .product h1 { font-size: clamp(34px, 5vw, 56px); line-height: .98; font-weight: 800;
                color: #fff; letter-spacing: -.01em; margin-bottom: 12px;
                text-shadow: 0 2px 24px rgba(30, 91, 37, .25); }
  .product p { font-size: 15px; line-height: 1.5; color: #eefadf; margin-bottom: 22px; max-width: 34ch; }
  .cta { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
         background: var(--green-deep); color: #fff; text-decoration: none;
         font-weight: 700; font-size: 14px; letter-spacing: .06em;
         padding: 14px 26px; border-radius: 999px;
         box-shadow: 0 8px 24px rgba(20, 70, 25, .35);
         transition: transform .25s ease, box-shadow .25s ease; }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(20, 70, 25, .42); }
  .cta span { font-size: 17px; line-height: 1; }
  .facts { text-align: right; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
           font-weight: 600; color: rgba(255, 255, 255, .92); line-height: 2; }

  #loader { position: fixed; inset: 0; z-index: 50; background: var(--green-bg);
            display: flex; align-items: center; justify-content: center;
            transition: opacity .7s ease; }
  #loader img { width: min(46vw, 300px); animation: pulse 1.6s ease-in-out infinite; }
  #loader.done { opacity: 0; pointer-events: none; }
  @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.985); }
                     50% { opacity: 1; transform: scale(1); } }

  @media (max-width: 640px) {
    header, footer { padding: 20px 22px; }
    .facts { display: none; }
    .product p { font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Rotating 3D can of MANA Melon & Mint yerba maté"></canvas>

<div class="ui">
  <header>
    <a class="brand" href="#" aria-label="MANA home"><img src="assets/mana-logo.svg" alt="MANA"></a>
    <div class="top-note">Organic energy infusion</div>
  </header>
  <footer>
    <div class="product">
      <div class="kicker">Yerba Maté · Québec</div>
      <h1>Melon &amp; Mint</h1>
      <p>Cold-brewed yerba maté with a splash of summer melon and fresh mint.
         120&nbsp;mg of natural caffeine. No crash. 355&nbsp;ml.</p>
      <a class="cta" href="#"><span>⌁</span> Shop this flavour</a>
    </div>
    <div class="facts">
      Sans crash · No crash<br>
      Caféine naturelle · 120 mg<br>
      Végétalien · Vegan
    </div>
  </footer>
</div>

<div id="loader"><img src="assets/mana-logo.svg" alt="Loading MANA"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
